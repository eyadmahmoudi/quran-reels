<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Deep green background -->
  <rect width="64" height="64" rx="10" fill="#0f3d1f"/>
  <!-- Outer gold frame -->
  <rect x="3" y="3" width="58" height="58" rx="8" fill="none" stroke="#c9a84c" stroke-width="2"/>
  <!-- Inner gold frame -->
  <rect x="7" y="7" width="50" height="50" rx="6" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.6"/>

  <!-- Book body -->
  <rect x="11" y="10" width="42" height="46" rx="3" fill="#1a5c2e"/>
  <!-- Book spine (left) -->
  <rect x="11" y="10" width="6" height="46" rx="2" fill="#0d3d1a"/>
  <!-- Spine highlight -->
  <rect x="15" y="10" width="1" height="46" fill="#c9a84c" opacity="0.4"/>

  <!-- Gold ornament border on book cover -->
  <rect x="20" y="14" width="30" height="38" rx="2" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.7"/>

  <!-- Top ornament diamond -->
  <polygon points="35,16 37,19 35,22 33,19" fill="#c9a84c" opacity="0.9"/>
  <!-- Bottom ornament diamond -->
  <polygon points="35,42 37,45 35,48 33,45" fill="#c9a84c" opacity="0.9"/>

  <!-- Arabic "القرآن" stylized — crescent + star -->
  <circle cx="35" cy="32" r="7" fill="none" stroke="#f0d080" stroke-width="1.5"/>
  <circle cx="38" cy="29.5" r="5.5" fill="#1a5c2e"/>
  <polygon points="41,26 42,28.5 40,28.5" fill="#f0d080"/>

  <!-- Corner ornaments -->
  <circle cx="22" cy="18" r="1.2" fill="#c9a84c" opacity="0.7"/>
  <circle cx="48" cy="18" r="1.2" fill="#c9a84c" opacity="0.7"/>
  <circle cx="22" cy="47" r="1.2" fill="#c9a84c" opacity="0.7"/>
  <circle cx="48" cy="47" r="1.2" fill="#c9a84c" opacity="0.7"/>
</svg>
